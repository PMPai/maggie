services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maggie
      POSTGRES_PASSWORD: maggie
      POSTGRES_DB: maggie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggie"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # API not exposed to host — accessed via frontend proxy at :8081/api/*
    volumes:
      - archive:/data/archive
      - ./backend:/app
      - ./scripts:/app/scripts:ro
      - ./sample-data:/app/sample-data:ro
      - ./templates:/templates:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - archive:/data/archive
      - ./backend:/app
      - ./scripts:/app/scripts:ro
      - ./sample-data:/app/sample-data:ro
      - ./templates:/templates:ro
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api
    ports:
      - "8081:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

volumes:
  pgdata:
  archive:
